# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Fabric API
fabric_api_version=0.161.0+26.3

# Mod Properties
mod_version_prefix=0.5.4.13
mod_version=
mod_version_suffix=
# Whether to append git commit hash to the version (true/false)
append_git_hash=true
maven_group=cn.LPCTools
archives_base_name=LPCTools

# Required malilib version
# https://github.com/sakura-ryoko/malilib/releases
# https://modrinth.com/mod/malilib
malilib_version = 0.30.1
conditionalmixin_version = 0.6.4

# minihud version
# https://github.com/sakura-ryoko/minihud/releases
# https://modrinth.com/mod/minihud
# 0.41.1 这个版本号在 Modrinth maven 上已被更早的构建占用（纯版本号 404），
# 参照 LPCCarpetAddition 的做法用 loader+游戏版本过滤定位 26.3 的 fabric 构建
minihud_version = 0.41.1-fabric,26.3

# litematica version
# https://github.com/sakura-ryoko/litematica/releases
# https://modrinth.com/mod/litematica
litematica_version = 0.29.0

# tweakeroo version
# https://github.com/sakura-ryoko/tweakeroo/releases
# https://modrinth.com/mod/tweakeroo
# 同上：纯 0.30.0 在 Modrinth maven 上 404，需用 loader+游戏版本过滤
tweakeroo_version = 0.30.0-fabric,26.3

# placeholder-api version
# https://modrinth.com/mod/placeholder-api
placeholder_api_version = 3.2.0+26.3

# mod_menu version
# https://github.com/TerraformersMC/ModMenu/releases
# https://modrinth.com/mod/modmenu
mod_menu_version = 21.0.0-beta.1

# spark version
# https://modrinth.com/mod/spark
spark_version = 1.10.187-fabric

# fabric permission api version
# https://modrinth.com/mod/fabric-permissions-api
# fabric_permissions_api_version = 0.6.1

# sodium version
# https://modrinth.com/mod/sodium
sodium_version = mc26.3-0.9.2-fabric

# iris version
# https://modrinth.com/mod/iris
iris_version = 1.11.6+26.3-fabric

# immediatelyfast version
# https://modrinth.com/mod/immediatelyfast
immediatelyfast_version = 1.17.1+26.3-fabric
reflect_version=1.6.1+curseforge

# viafabricplus version
# https://modrinth.com/mod/viafabricplus
viafabricplus_version = 5.1.0

# xaero world map version
# https://modrinth.com/mod/xaeros-world-map
xaero_world_map_version = fabric-26.3-1.46.4

# xaero minimap version
# https://modrinth.com/mod/xaeros-minimap
xaero_minimap_version = fabric-26.3-26.5.3
